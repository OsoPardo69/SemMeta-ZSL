dataset_name: avast

embeddings_dir: data/avast/embeddings
tabular_csv: data/avast/features.csv
output_dir: outputs/avast

input_dim: null         # set after inspecting the dataset
output_dim: 4096
hidden_dim: 1024
dropout: 0.1

num_episodes: 5000
support_size: 2
query_size: 4
episode_batch: 32

lambda_query: 2.9
kd_temperature: 1.5
alpha: 0.7
grad_clip: 0.5
noise_std: 0.0

lr: 1.0e-4
weight_decay: 1.0e-2
z_threshold: 1.5

seed: 42
